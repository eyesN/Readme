name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write   # 🔥 REQUIRED (fixes token error)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: eyesN
          outputs: |
               dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v4   # ✅ UPDATED ACTION (Node 24 safe)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}  # ✅ FIX TOKEN ERROR
          publish_dir: ./dist
          publish_branch: output
